<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f121a" />
    <title>BTCUSDT · tradingView</title>
    <!--
      The two body faces (IBM Plex Sans 400 for the UI, IBM Plex Mono 400 for prices) start
      downloading with this page instead of after the script has rendered text. They are the same
      files the @fontsource stylesheets in src/main.tsx point at, so Vite emits one hashed asset
      for each and the stylesheet reuses the preloaded response (fonts are CORS fetches, hence
      `crossorigin`).
    -->
    <link
      rel="preload"
      href="/node_modules/@fontsource/ibm-plex-sans/files/ibm-plex-sans-latin-400-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/node_modules/@fontsource/ibm-plex-mono/files/ibm-plex-mono-latin-400-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <script>
      // Apply the saved theme before the stylesheet paints, so a light-theme user never sees a
      // dark frame. main.tsx re-applies it from state/settings.ts (the source of truth).
      // 'tv.settings.v1' is SETTINGS_KEY and the colours are THEME_CHROME_COLORS (the --chrome
      // token of each theme), both in src/state/settings.ts: keep them in step.
      try {
        var t = JSON.parse(localStorage.getItem('tv.settings.v1') || '{}').theme
        if (t === 'light' || t === 'dark') {
          document.documentElement.dataset.theme = t
          document.documentElement.style.colorScheme = t
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', t === 'light' ? '#f0f3fa' : '#0f121a')
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
