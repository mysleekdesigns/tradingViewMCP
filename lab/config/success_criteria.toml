# PROPOSED Phase 8 success criteria and per-run budgets (PLAN.md "Success criteria").
# Nothing reads this file. The owner installs it, in their own terminal (the target is
# read-only to Claude while .claude/lab.lock exists):
#
#   cp agents/config/success_criteria.proposed.toml lab/config/success_criteria.toml
#
# Once installed it is fixed before a run and never relaxed mid-run; the MCP server snapshots
# it (with its sha256) into the ledger when a research run starts.

[criteria]
wf_oos_sharpe_min = 1.0             # walk-forward out-of-sample Sharpe >= 1.0 after fees and slippage
dsr_min = 0.95                      # Deflated Sharpe Ratio with the run's full trial count
pbo_max = 0.2                       # probability of backtest overfitting
beat_buy_hold = true                # Sharpe above buy-and-hold
beat_vol_target = true              # Sharpe above vol-targeted buy-and-hold
random_entry_percentile_min = 95.0  # beats 95% of same-trade-count random entries
cost_stress_factor = 2.0            # still profitable at x2 costs
require_gradual_delay_decay = true  # edge decays gradually under 1/3/5-bar signal delay
max_drawdown_max = 0.25             # max drawdown <= 25%
min_trades = 100                    # enough trades to mean something
min_profitable_regimes = 2          # of bull / bear / sideways, unless explicitly regime-gated
regime_window_days = 90             # a quarter is the usual horizon for calling a crypto bull or bear market
regime_threshold = 0.10             # +/-10% over it separates trending from range-bound quarters for BTC/ETH
neighbourhood_pct = 0.2             # +/-20% parameter neighbours stay profitable
require_holdout_pass = true         # passes the locked holdout
require_crosscheck_match = true     # matches in the event-driven cross-check engine

[budget]
max_hypotheses = 5                  # ideas tested per run
max_proposals = 15                  # distinct plans submitted for a backtest
max_backtests = 3000                # ledger trials under the run, Optuna trials included
max_holdout_checks = 1              # also capped by lab.toml holdout_budget (3)
max_usd = 20.0                      # model spend cap for an autonomous run
