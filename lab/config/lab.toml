# Lab constants that change results. Each has a one-line justification (python-lab rule).
# Loaded by lab.config.load_config(); tests pass explicit values instead of reading this file.

[data]
dir = "data"                     # parquet + ledger live in lab/data/ (gitignored)
archive_base_url = "https://data.binance.vision/data/spot"  # Binance public archive, no key

[costs]
fee_rate = 0.001                 # Binance spot taker fee without BNB discount (0.1%)
slippage_rate = 0.0005           # 0.05% per side, PLAN.md starting assumption for BTC/ETH
slippage_vol_mult = 0.1          # widen slippage by 10% of a bar's excess range over its trailing median
slippage_cap = 0.01              # never more than 1% per side: deep BTC/ETH books absorb retail size even in crashes
stress_factors = [2.0, 4.0]      # PLAN.md cost stress x2 and x4

[engine]
init_cash = 10000.0              # notional only; returns are scale-free

[splits]
design_start = "2019-01-01"      # earliest design data; Binance BTCUSDT liquid well before this
holdout_start = "2025-10-01"     # PLAN.md 12-month holdout, fixed so it never silently moves as data refreshes
holdout_budget = 3               # PLAN.md: at most 3 holdout checks per research run
wf_train_months = 24             # walk-forward: optimise on 2 years
wf_test_months = 6               # then test on the next 6 months
wf_step_months = 6               # roll forward by the test length (non-overlapping tests)
wf_anchored = false              # rolling train window so old regimes age out

[benchmarks]
vol_target_annual = 0.40         # target ~40% annual vol, below BTC's long-run ~60-70%
vol_lookback_days = 30           # trailing realised-vol window, a common vol-targeting choice
vol_max_leverage = 1.0           # spot, no leverage: weight capped at 100%
random_entry_paths = 200         # random-entry null paths in the default (non-slow) run
vol_min_rebalance = 0.10         # skip vol-target rebalances under 10% of equity so the benchmark is not churned by noise

[stats]
bootstrap_samples = 1000         # stationary bootstrap resamples
bootstrap_mean_block = 20        # mean block length in bars (Politis-Romano)
confidence = 0.95                # two-sided CI level
pbo_splits = 16                  # CSCV partitions S (Bailey et al. 2017 use 16)
neighbourhood_steps = [0.8, 0.9, 1.0, 1.1, 1.2]  # +/-20% parameter neighbours for PBO/robustness
neighbourhood_max_trials = 25    # base + 6 tunables (Phase 8 cap) x 4 non-base steps, so every +/-20% neighbour runs
adversarial_delays = [1, 3, 5]   # PLAN.md signal delay checks
monte_carlo_paths = 1000         # trade-order reshuffles
permutation_paths = 100          # full-pipeline permutation null in the default run (slow: 1000)

[optuna]
n_trials = 50                    # default budget per search; every trial goes to the ledger
seed = 7                         # explicit sampler seed for reproducibility
min_trades = 30                  # below ~30 trades a Sharpe is a few outcomes; search treats it as failed

[research]
family_return_corr = 0.8         # >=0.8: same-logic re-tunes 0.85-0.99 and EMA vs SMA at equal periods 0.88 on BTC 4h are one idea; distinct ideas (RSI MR vs EMA cross) <=0.34; no-op clauses ~1.0
family_min_overlap_bars = 250    # common bars needed to correlate two series (other interval/window); s.e. of r near 0.8 is (1-r^2)/sqrt(n) ~0.02, small against the threshold
min_variance_plans = 10          # DSR V[SR] needs >=10 commensurable plans: the sample variance's relative s.e. is sqrt(2/(n-1)), ~47% at 10 and worse below
min_pbo_trials = 16              # sweep-CSCV PBO needs >=16 usable Optuna trials: as many as the 16 CSCV splits, fewer columns make the in-sample "best" a near coin flip
literal_lineage_corr = 0.95      # another family logic's hand-tuned literals block this plan's walk-forward only at >=0.95: no-op/cosmetic copies correlate ~1.0, genuinely different trend followers (EMA vs ROC) 0.8-0.9

[api]
host = "127.0.0.1"               # local only
port = 8788                      # server/ uses 8787

[universe]
# Point-in-time multi-coin universe (lab.data.universe_build). Not part of the research-run
# fingerprint yet: no plan type reads it until the owner adds portfolio backtests.
quote = "USDT"                   # Binance's deepest spot books; nearly every listed coin has a USDT pair
interval = "1d"                  # cross-sectional momentum ranks multi-week returns and rebalances weekly
archive_list_url = "https://s3-ap-northeast-1.amazonaws.com/data.binance.vision"  # S3 listing behind data.binance.vision; keeps delisted symbols
top_n = 30                       # liquid core: research note H1 uses the top 20-30 by trailing volume
volume_window_days = 30          # trailing median dollar volume over a month, robust to one-day spikes
min_history_days = 365           # PLAN.md: a coin is eligible only after 1 year of trading history
relist_gap_days = 30             # a hole over a month is a delisting/relisting or ticker reuse (LUNA): restart the clock
relist_jump = 5.0                # hole + >5x open vs last close = new market: redenominations (BNX, COCOS, QUICK), reuse (LUNA)
delisted_after_days = 7          # manifest only: no bar in the final week of data = delisted
exclude_bases = [                # not ordinary coins: stablecoins, fiat, gold, wrapped/staked duplicates, BTC 3x BULL/BEAR tokens
  "USDC", "BUSD", "TUSD", "USDP", "PAX", "DAI", "FDUSD", "UST", "USTC", "USDS", "USDSB", "USDSOLD",
  "SUSD", "USDE", "USD1", "RLUSD", "BFUSD", "XUSD", "PYUSD", "AEUR", "EURI",
  "EUR", "GBP", "AUD", "BKRW", "KGST", "U",
  "PAXG", "XAUT",
  "WBTC", "WBETH", "BETH",
  "BULL", "BEAR",
]
