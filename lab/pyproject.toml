[project]
name = "lab"
version = "0.1.0"
description = "Honest crypto backtesting lab: declarative plans, next-bar fills, costs, trial ledger, DSR/PBO"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.162.0",
    "hedgefund[hmm]",
    "httpx>=0.28.1",
    "mcp>=2.3,<3",
    "numpy>=2.5.4",
    "optuna>=5.0.0",
    "pandas>=3.1.0",
    "pyarrow>=26.0.0",
    "pydantic>=2.14.1",
    "uvicorn[standard]>=0.54.0",
    "vectorbt>=1.2.0",
]

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.uv.sources]
hedgefund = { path = "../../hedgeFund", editable = true }

[tool.uv]
# The event-driven cross-check engine is imported lazily but installed by default so the
# gate can exercise it; `uv sync --no-group crosscheck` gives a lighter environment.
default-groups = ["dev", "crosscheck"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["lab", "tests"]
extend-exclude = [".venv", "data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["lab"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not slow'"
markers = [
    "slow: permutation/bootstrap runs with N >= 1000 or anything over a few seconds; excluded by default",
]
filterwarnings = [
    "error::DeprecationWarning:lab.*",
    # vectorbt 1.2 still calls DataFrame.rename(inplace=True), deprecated in pandas 3.1.
    "ignore:The inplace keyword in DataFrame.rename is deprecated:Warning:vectorbt.*",
]
xfail_strict = true

[dependency-groups]
crosscheck = [
    "nautilus-trader>=1.231.0",
]
dev = [
    "httpx2>=2.16.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]
